# Two independent MySQL 8.4 servers, one per dataset size. Same image, same settings,
# same database name (shopdb), so every script and query works against either one:
#
#   lab   service "mysql"       port 3306  CSVs in ./data       the lab / live-demo size (scale 0.2)
#   full  service "mysql-full"  port 3307  CSVs in ./data-full  the course dataset (scale 1, 6M orders)
#
#   docker compose up -d                  # lab only (as before)
#   docker compose up -d mysql-full       # full only
#   docker compose --profile full up -d   # both
#
# Each server has its own data volume and its own buffer pool, so timings on one are never
# polluted by the other. Stop the one you are not measuring:  docker compose stop mysql-full

x-mysql: &mysql
  image: mysql:8.4
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: shopdb
    MYSQL_USER: app
    MYSQL_PASSWORD: app
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
    interval: 10s
    timeout: 5s
    retries: 12
  # Give the containers real memory: Docker Desktop -> Settings -> Resources (4 GB or more,
  # 6 GB or more if both servers run at the same time).

services:
  mysql:                                     # lab: scale 0.2
    <<: *mysql
    container_name: db102-mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./data:/data:ro                      # generated CSVs, read by LOAD DATA INFILE

  mysql-full:                                # full: scale 1
    <<: *mysql
    container_name: db102-mysql-full
    profiles: ["full"]                       # not started by a plain `docker compose up -d`
    ports:
      - "3307:3306"
    # Same db102.cnf as the lab server. The buffer pool (1G there) can be raised for this server
    # only, e.g. DB102_FULL_BUFFER_POOL=4G docker compose up -d mysql-full
    command: ["--innodb-buffer-pool-size=${DB102_FULL_BUFFER_POOL:-1G}"]
    volumes:
      - mysql_data_full:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./data-full:/data:ro

volumes:
  mysql_data:
  mysql_data_full:
