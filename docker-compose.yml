services:
  mysql:
    image: mysql:8.4
    container_name: db102-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shopdb
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./data:/data:ro                      # generated CSVs, read by LOAD DATA INFILE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Give the container real memory: Docker Desktop -> Settings -> Resources (4 GB or more).

volumes:
  mysql_data:
